name: DiscordHook
authors: [SafeZoneMoRi]
version: '1.1'
main: org.minecraft.discordHook.DiscordHook
api-version: '1.21'
depend:
  - DiscordSRV
commands:
  discordhook:
    description: DiscordHook main command
    usage: /<command> <reload|list|check <player>|reset <player>>
    permission: discordhook.admin
    permission-message: §cYou do not have permission to use this command!
    aliases:
      - dh
  discord:
    description: Get Discord invite link
    usage: /discord
    permission: discordhook.discord
